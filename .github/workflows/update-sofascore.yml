name: Atualizar Sofascore

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_sofascore.py"
      - ".github/workflows/update-sofascore.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cliente HTTP com fingerprint Chrome
        run: pip install --disable-pip-version-check curl_cffi

      - name: Enriquecer feed com Sofascore
        run: python scripts/update_sofascore.py

      - name: Publicar somente se houver mudança
        run: |
          if git diff --quiet -- data/latest.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "tigre-data-bot"
          git config user.email "tigre-data-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Atualiza dados complementares do Sofascore"
          git push
